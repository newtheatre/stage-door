# Weekly export of the auth DB to R2 (docs/operations.md#backups).
# Retention is enforced by R2 lifecycle rules on the bucket, not here:
# weekly/ objects expire after 70 days, monthly/ after 400.
#
# Uses the same CLOUDFLARE_API_TOKEN repo secret as deploy.yml — the token
# additionally needs D1:Edit and Workers R2 Storage:Edit.
name: Backup auth DB

on:
  schedule:
    # Mondays 04:00 UTC — quiet hours, after any weekend activity.
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3d250a94794003bd921b7f0379de7f00
    steps:
      - name: Export
        run: npx wrangler@4 d1 export auth --remote --output auth-backup.sql

      - name: Upload (weekly, plus monthly on the first Monday)
        run: |
          STAMP=$(date -u +%F)
          npx wrangler@4 r2 object put "nnt-db-backups/weekly/auth-$STAMP.sql" --file auth-backup.sql --remote
          if [ "$(date -u +%d)" -le 07 ]; then
            npx wrangler@4 r2 object put "nnt-db-backups/monthly/auth-$STAMP.sql" --file auth-backup.sql --remote
          fi

      - name: Verify upload
        run: npx wrangler@4 r2 object get "nnt-db-backups/weekly/auth-$(date -u +%F).sql" --file check.sql --remote && test -s check.sql
