# Deploys go through CI on merge to main (docs/operations.md#deployments).
# Migrations are NOT applied here — they are explicit, per the runbook.
#
# Required repo secret: CLOUDFLARE_API_TOKEN — a token with Workers Scripts:Edit
# on the New Theatre account (create in the Cloudflare dashboard; record in the
# password manager as "stage-door CI deploy token").
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3d250a94794003bd921b7f0379de7f00
          workingDirectory: .output
          command: deploy
