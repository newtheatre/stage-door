# Test, lint, typecheck and build on every push and PR. Deployment is NOT
# here: Cloudflare's Workers Builds git integration deploys main on its own.
#
# Build runs because merging to main deploys, so a bundle that does not build
# is discovered by Workers Builds otherwise (ADR-0021).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Comments
        run: bun run check:comments

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
